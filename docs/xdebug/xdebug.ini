; ============================================================
; Xdebug Configuration — add to your php.ini
; ============================================================
; On Windows (Scoop): C:\Users\<you>\scoop\apps\php\current\cli\php.ini
; On Linux:           /etc/php/8.x/cli/conf.d/20-xdebug.ini
;
; Install Xdebug:
;   pecl install xdebug   (Linux/Mac)
;   scoop install xdebug  (Windows — or download DLL from xdebug.org)
;
; After adding these lines, verify with:
;   php -v   (should show "with Xdebug v3.x")
; ============================================================

[xdebug]
zend_extension=xdebug

; Mode: debug for step-debugging, develop for var_dump improvements
; Combine with comma: debug,develop
xdebug.mode=debug

; Start debugging on every request (use "trigger" for on-demand)
xdebug.start_with_request=yes

; IDE connection settings (VS Code default)
xdebug.client_host=127.0.0.1
xdebug.client_port=9003

; Log Xdebug connection attempts (useful for troubleshooting)
; xdebug.log=/tmp/xdebug.log

; IDE key (optional — useful when multiple devs share a server)
xdebug.idekey=VSCODE
